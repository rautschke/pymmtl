[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymmtl"
version = "0.1.0"
description = "Python front-end (model, I/O, GUI) for the MMTL BEM transmission-line solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
iterate = ["scipy>=1.7"]
dev = ["pytest>=7", "scipy>=1.7"]

[project.scripts]
pymmtl = "pymmtl.cli:main"

[project.gui-scripts]
pymmtl-gui = "pymmtl.gui.app:main"

[tool.setuptools]
packages = ["pymmtl", "pymmtl.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
tk = "*"
cmake = ">=3.5,<4"
make = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"

[tool.pixi.pypi-dependencies]
pymmtl = { path = ".", editable = true }

[tool.pixi.feature.iterate.pypi-dependencies]
pymmtl = { path = ".", editable = true, extras = ["iterate"] }

[tool.pixi.feature.dev.pypi-dependencies]
pymmtl = { path = ".", editable = true, extras = ["dev"] }

[tool.pixi.environments]
default = { features = [] }
iterate = { features = ["iterate"] }
dev = { features = ["dev"] }

[tool.pixi.tasks]
build-solver = "cmake -S csrc/bem -B csrc/bem/build -DCMAKE_BUILD_TYPE=Release && cmake --build csrc/bem/build -j"

[tool.pixi.tasks.gui]
cmd = "python -m pymmtl.gui.app"
depends-on = ["build-solver"]

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest", depends-on = ["build-solver"] }
