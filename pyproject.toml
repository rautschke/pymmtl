[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymmtl"
version = "0.1.0"
description = "Python front-end (model, I/O, GUI) for the MMTL BEM transmission-line solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
iterate = ["scipy>=1.7"]
dev = ["pytest>=7", "scipy>=1.7"]

[project.scripts]
pymmtl = "pymmtl.cli:main"

[project.gui-scripts]
pymmtl-gui = "pymmtl.gui.app:main"

[tool.setuptools]
packages = ["pymmtl", "pymmtl.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
